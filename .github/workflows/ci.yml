name: CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - name: Unit tests (offline, synthetic data)
        run: python -m pytest -q tests
      - name: Reproduce the committed results table from the committed snapshot
        run: |
          python -m prof_ratings evaluate
          git diff --exit-code results/model_comparison.csv
